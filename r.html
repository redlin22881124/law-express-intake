<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>回傳到法律快易通</title>
  <style>
    body { margin:0; font-family:"PingFang TC","Noto Sans TC",sans-serif; background:#F3F0EA; color:#0F172A; }
    main { max-width:560px; margin:0 auto; padding:48px 20px; }
    h1 { font-size:22px; color:#1E293B; }
    p { color:#66707C; line-height:22px; }
    a, button { display:block; width:100%; min-height:50px; margin-top:16px; border:0; border-radius:14px; background:#0F766E; color:#fff; font-size:16px; font-weight:700; text-align:center; line-height:50px; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <h1>回傳到 App</h1>
    <p id="status">正在打開法律快易通…請用律師的手機點這個頁面。</p>
    <a id="open" href="#">開啟法律快易通</a>
  </main>
  <script>
    const token = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    const status = document.getElementById("status");
    const open = document.getElementById("open");
    if (!token || token.indexOf("LE1.") !== 0) {
      status.textContent = "這組回傳資料無法讀取。請請當事人再傳一次。";
      open.style.display = "none";
    } else {
      const appUrl = "law-express://intake-import?d=" + encodeURIComponent(token);
      const intentUrl = "intent://intake-import?d=" + encodeURIComponent(token) + "#Intent;scheme=law-express;package=com.lawexpress.app;end";
      const android = /android/i.test(navigator.userAgent);
      open.href = appUrl;
      location.href = android ? intentUrl : appUrl;
    }
  </script>
</body>
</html>
