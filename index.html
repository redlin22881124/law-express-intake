<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>諮詢前資料</title>
  <style>
    :root { --bg:#F3F0EA; --ink:#0F172A; --muted:#66707C; --card:#fff; --accent:#0F766E; --navy:#1E293B; --line:#E5DFD4; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:560px; margin:0 auto; padding:24px 20px 48px; }
    .kicker { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.4px; }
    h1 { font-size:22px; line-height:30px; color:var(--navy); margin:6px 0 8px; }
    p { color:var(--muted); font-size:14px; line-height:22px; }
    label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
    input, textarea { width:100%; min-height:52px; border:1px solid var(--line); border-radius:14px; padding:12px; font-size:16px; background:#FAF8F4; color:var(--ink); }
    textarea { min-height:96px; resize:vertical; }
    button { width:100%; min-height:50px; margin-top:12px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-size:16px; font-weight:700; }
    button.secondary { background:#FAF8F4; color:var(--navy); border:1px solid var(--line); }
    .note { font-size:12px; line-height:18px; color:var(--muted); background:#EEEAE3; border-radius:14px; padding:12px; margin-top:16px; }
    .token { word-break:break-all; background:var(--card); border-radius:14px; padding:12px; font-size:13px; line-height:20px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main id="picker-view">
    <div class="kicker">法律快易通</div>
    <h1>諮詢前資料</h1>
    <p>請選類型。直接填即可，不必下載 App。這不是法律諮詢。</p>
    <div id="kind-buttons"></div>
  </main>
  <main id="form-view" class="hidden">
    <div class="kicker" id="kind-label"></div>
    <h1>諮詢前請先填這些</h1>
    <p>填完請傳回給律師。這不是法律諮詢。</p>
    <form id="form"></form>
    <p class="note">請只把回傳連結給律師。連結含你填的資料。</p>
  </main>
  <main id="done-view" class="hidden">
    <div class="kicker">不必下載 App</div>
    <h1>請傳回給律師</h1>
    <p>按下面按鈕用 LINE 傳回。請只傳給律師。</p>
    <button type="button" id="line-btn">用 LINE 傳回律師</button>
    <button type="button" class="secondary" id="copy-btn">複製回傳連結</button>
    <p>若按鈕沒反應，請複製下面連結傳給律師。</p>
    <div class="token" id="return-url"></div>
  </main>
  <script src="./questions.js"></script>
  <script>
    function utf8ToBase64Url(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      bytes.forEach((b) => { binary += String.fromCharCode(b); });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
    const spec = window.INTAKE_FORM;
    const params = new URLSearchParams(location.search);
    const rid = params.get("rid") || "";
    let kindId = params.get("k") || "";

    function questionsFor(id) {
      const kind = spec.kinds.find((item) => item.id === id) || spec.kinds[3];
      return { kind: kind, questions: spec.shared.concat(spec.byKind[kind.id] || spec.byKind.other) };
    }

    function showForm(id) {
      const { kind, questions } = questionsFor(id);
      kindId = kind.id;
      document.getElementById("kind-label").textContent = kind.label;
      const form = document.getElementById("form");
      form.innerHTML = "";
      questions.forEach((q) => {
        const label = document.createElement("label");
        label.textContent = q.label;
        const field = document.createElement(q.multiline ? "textarea" : "input");
        field.id = q.id;
        field.placeholder = q.placeholder || "";
        form.appendChild(label);
        form.appendChild(field);
      });
      const submit = document.createElement("button");
      submit.type = "submit";
      submit.textContent = "填完，傳回律師";
      form.appendChild(submit);
      document.getElementById("picker-view").classList.add("hidden");
      document.getElementById("form-view").classList.remove("hidden");
    }

    spec.kinds.forEach((item) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = item.label;
      btn.onclick = function () { showForm(item.id); };
      document.getElementById("kind-buttons").appendChild(btn);
    });

    if (kindId) showForm(kindId);

    document.getElementById("form").addEventListener("submit", (event) => {
      event.preventDefault();
      const { kind, questions } = questionsFor(kindId);
      const answers = {};
      questions.forEach((q) => {
        const value = document.getElementById(q.id).value.trim();
        if (value) answers[q.id] = value;
      });
      const payload = { v: 1, k: kind.id, a: answers };
      if (rid) payload.id = rid;
      const token = "LE1." + utf8ToBase64Url(JSON.stringify(payload));
      const returnUrl = new URL("r.html", location.href).toString() + "#" + encodeURIComponent(token);
      document.getElementById("return-url").textContent = returnUrl;
      document.getElementById("form-view").classList.add("hidden");
      document.getElementById("done-view").classList.remove("hidden");
      const message = "諮詢前資料已填完。請律師用手機點連結，會進入法律快易通「待諮詢」：\n" + returnUrl;
      document.getElementById("line-btn").onclick = function () {
        location.href = "https://line.me/R/share?text=" + encodeURIComponent(message);
      };
      document.getElementById("copy-btn").onclick = async function () {
        try {
          await navigator.clipboard.writeText(returnUrl);
          this.textContent = "已複製";
        } catch (e) {}
      };
    });
  </script>
</body>
</html>
