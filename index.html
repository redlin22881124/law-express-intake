<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>法律諮詢預約單</title>
  <style>
    :root {
      --bg: #F3F0EA;
      --ink: #0F172A;
      --muted: #5B6570;
      --card: #fff;
      --accent: #0F766E;
      --accent-soft: #E7F4F2;
      --navy: #1E293B;
      --line: #E5DFD4;
      --input: #FAF8F4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(1200px 420px at 50% -80px, #dceeea 0%, transparent 70%),
        var(--bg);
      color: var(--ink);
    }
    main { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .mark {
      width: 36px; height: 36px; border-radius: 12px; background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    .brand { font-size: 15px; font-weight: 700; color: var(--navy); }
    .step {
      display: inline-block; background: var(--accent-soft); color: var(--accent);
      font-size: 14px; font-weight: 700; border-radius: 999px; padding: 6px 12px; margin-bottom: 10px;
    }
    h1 { font-size: 28px; line-height: 38px; color: var(--navy); margin: 0 0 10px; font-weight: 800; }
    .lead { color: var(--muted); font-size: 17px; line-height: 28px; margin: 0 0 22px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 22px;
      padding: 22px 18px 20px; box-shadow: 0 10px 30px rgba(30, 41, 59, .06);
    }
    .field { margin-bottom: 16px; }
    label, .field-title { display: block; font-size: 16px; font-weight: 700; color: var(--navy); margin: 0 0 8px; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--input); color: var(--ink); font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .choice input[type="radio"] {
      appearance: auto; -webkit-appearance: radio;
      width: 16px; height: 16px; min-height: 16px; margin: 0; flex-shrink: 0;
      accent-color: var(--accent); position: static; opacity: 1; pointer-events: auto;
    }
    .choice:has(input:checked) {
      background: var(--accent-soft); border-color: var(--accent); color: var(--navy);
    }
    input:not([type="radio"]), textarea {
      width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 16px; font-size: 18px; line-height: 26px; background: var(--input); color: var(--ink);
    }
    textarea { min-height: 112px; resize: vertical; }
    input:not([type="radio"]):focus, textarea:focus {
      outline: 2px solid rgba(15, 118, 110, .35); border-color: var(--accent); background: #fff;
    }
    button {
      width: 100%; min-height: 56px; margin-top: 8px; border: 0; border-radius: 16px;
      background: var(--accent); color: #fff; font-size: 18px; font-weight: 800;
    }
    button.secondary { background: #fff; color: var(--navy); border: 1px solid var(--line); font-weight: 700; }
    button:disabled { opacity: .65; }
    .note {
      font-size: 14px; line-height: 22px; color: var(--muted); background: #EEEAE3;
      border-radius: 16px; padding: 14px 16px; margin-top: 16px;
    }
    .error { font-size: 15px; line-height: 22px; color: #B45309; margin: 10px 0 0; }
    .token {
      word-break: break-all; background: var(--card); border-radius: 16px; padding: 14px;
      font-size: 15px; line-height: 22px; border: 1px solid var(--line);
    }
    .done-mark {
      width: 56px; height: 56px; border-radius: 28px; background: var(--accent-soft); color: var(--accent);
      font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main id="form-view">
    <div class="topbar">
      <div class="mark">法</div>
      <div class="brand">法律快易通</div>
    </div>
    <h1>法律諮詢預約單</h1>
    <p class="lead">請填寫以下資料，方便安排諮詢時間。</p>
    <div class="card">
      <form id="form"></form>
      <p id="form-error" class="error hidden"></p>
    </div>
    <p class="note">資料只會送給發出這份連結的律師。</p>
  </main>
  <main id="done-view" class="hidden">
    <div class="topbar">
      <div class="mark">法</div>
      <div class="brand">法律快易通</div>
    </div>
    <div class="card">
      <div class="done-mark">✓</div>
      <h1 id="done-title">已送給律師</h1>
      <p class="lead" id="done-lead">可以關閉此頁。律師端會自動出現這張預約單。</p>
      <div id="return-actions" class="hidden">
        <button type="button" id="copy-btn">複製回傳連結</button>
        <p class="lead">若沒反應，請複製下面連結傳給律師。</p>
        <div class="token" id="return-url"></div>
      </div>
    </div>
  </main>
  <script src="./questions.js?v=g3"></script>
  <script>
    (function ensureGenderChoices() {
      var fallback = ["男", "女", "其他", "不便說明"];
      var spec = window.INTAKE_FORM;
      if (!spec || !spec.questions) return;
      spec.questions = spec.questions.map(function (q) {
        if (q.id === "gender" && !(q.choices && q.choices.length)) {
          return { id: "gender", label: q.label || "性別", choices: fallback };
        }
        return q;
      });
    })();
    function utf8ToBase64Url(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      bytes.forEach((b) => { binary += String.fromCharCode(b); });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
    const spec = window.INTAKE_FORM;
    const apiBase = (window.INTAKE_API_BASE || "").replace(/\/$/, "");
    const inboxId = new URLSearchParams(location.search).get("inbox") || "";
    const questions = spec.questions || [];

    const form = document.getElementById("form");
    questions.forEach((q) => {
      const wrap = document.createElement("div");
      wrap.className = "field";
      if (q.choices && q.choices.length) {
        const title = document.createElement("div");
        title.className = "field-title";
        title.textContent = q.label;
        const group = document.createElement("div");
        group.className = "choices";
        group.setAttribute("role", "radiogroup");
        group.setAttribute("aria-label", q.label);
        q.choices.forEach((option) => {
          const choice = document.createElement("label");
          choice.className = "choice";
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = q.id;
          radio.value = option;
          choice.appendChild(radio);
          choice.appendChild(document.createTextNode(option));
          group.appendChild(choice);
        });
        wrap.appendChild(title);
        wrap.appendChild(group);
      } else {
        const label = document.createElement("label");
        label.textContent = q.label;
        label.setAttribute("for", q.id);
        const field = document.createElement(q.multiline ? "textarea" : "input");
        field.id = q.id;
        field.placeholder = q.placeholder || "";
        wrap.appendChild(label);
        wrap.appendChild(field);
      }
      form.appendChild(wrap);
    });
    const submit = document.createElement("button");
    submit.type = "submit";
    submit.id = "submit-btn";
    submit.textContent = "送出預約";
    form.appendChild(submit);

    function showSent() {
      document.getElementById("done-title").textContent = "已送給律師";
      document.getElementById("done-lead").textContent = "可以關閉此頁。律師端會自動出現這張預約單。";
      document.getElementById("return-actions").classList.add("hidden");
      document.getElementById("form-view").classList.add("hidden");
      document.getElementById("done-view").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function showReturnLink(returnUrl) {
      document.getElementById("done-title").textContent = "請把連結傳回律師";
      document.getElementById("done-lead").textContent = "這次無法直接送到律師端。請複製連結，只傳給律師。";
      document.getElementById("return-url").textContent = returnUrl;
      document.getElementById("return-actions").classList.remove("hidden");
      document.getElementById("form-view").classList.add("hidden");
      document.getElementById("done-view").classList.remove("hidden");
      document.getElementById("copy-btn").onclick = async function () {
        try {
          await navigator.clipboard.writeText(returnUrl);
          this.textContent = "已複製";
        } catch (e) {}
      };
      window.scrollTo(0, 0);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const answers = {};
      questions.forEach((q) => {
        let value = "";
        if (q.choices && q.choices.length) {
          const checked = form.querySelector('input[name="' + q.id + '"]:checked');
          value = checked ? checked.value.trim() : "";
        } else {
          value = document.getElementById(q.id).value.trim();
        }
        if (value) answers[q.id] = value;
      });
      const errorEl = document.getElementById("form-error");
      const submitBtn = document.getElementById("submit-btn");
      errorEl.classList.add("hidden");
      if (apiBase && /^ib_[a-f0-9]{32}$/.test(inboxId)) {
        submitBtn.disabled = true;
        submitBtn.textContent = "送出中…";
        try {
          const response = await fetch(apiBase + "/v1/law-express/intakes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ inboxId: inboxId, kind: spec.kind || "other", answers: answers }),
          });
          if (response.ok) {
            showSent();
            return;
          }
        } catch (e) {}
        submitBtn.disabled = false;
        submitBtn.textContent = "送出預約";
        errorEl.textContent = "無法直接送出，請改用下面的回傳連結。";
        errorEl.classList.remove("hidden");
      }
      const token = "LE1." + utf8ToBase64Url(JSON.stringify({ v: 1, k: spec.kind || "other", a: answers }));
      showReturnLink(new URL("r.html", location.href).toString() + "#" + encodeURIComponent(token));
    });
  </script>
</body>
</html>
